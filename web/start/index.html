<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<script>if(location.hostname==='tsudumon.web.app'){location.replace('https://tsudumon.jp'+location.pathname+location.search+location.hash);}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>はじめる｜つづもん</title>
<!--
  無料おためしの入口。**中学生が最初に見る画面**。

  これまでは /account/?do=trial に直接飛ばしていたが、あそこは
  「アカウント・お支払い」「解約について」「お支払い・解約の管理」が並ぶページで、
  始める前の中学生には重すぎる（ユーザー指摘 2026-08-03）。
  お金の話は、興味を持ってもらったあと・保護者に見せる段階で出せばいい。

  このページに置くのは3つだけ:
    ① いま何が起きているか（準備しています）
    ② 終わったら自動で教材へ
    ③ うまくいかなかったときの逃げ道
  料金・解約・アカウントの語は**1つも出さない**。
-->
<style>
  :root { --brand:#b45309; --deep:#7c2d12; --amber:#f59e0b; --line:#fde68a; --ng:#dc2626; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
         color:#1c1917; background:linear-gradient(#fffdf8,#fef6e4); min-height:100vh;
         display:flex; align-items:center; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:400px; background:#fff; border:2px solid var(--line);
          border-radius:20px; padding:32px 24px 28px; box-shadow:0 8px 24px rgba(120,80,20,.14);
          text-align:center; }
  .badge { display:inline-block; background:var(--brand); color:#fff; font-weight:bold;
           padding:4px 16px; border-radius:20px; font-size:13px; }
  h1 { font-size:22px; color:var(--deep); margin:16px 0 6px; line-height:1.6; }
  p { font-size:14.5px; color:#57534e; line-height:1.9; }
  .spinner { width:38px; height:38px; margin:22px auto 8px; border:4px solid #f1e6cf;
             border-top-color:var(--amber); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }
  .big-btn { display:block; width:100%; margin-top:14px; border:none; border-radius:14px;
             padding:14px; font-size:16px; font-weight:bold; text-decoration:none; cursor:pointer;
             font-family:inherit; }
  .btn-line { background:#06c755; color:#fff; box-shadow:0 3px 8px rgba(6,199,85,.3); }
  .btn-main { background:var(--brand); color:#fff; box-shadow:0 3px 8px rgba(180,83,9,.3); }
  .btn-sub  { background:#fff; color:var(--brand); border:1.5px solid var(--line); }
  .msg { font-size:13.5px; line-height:1.85; border-radius:12px; padding:12px 15px;
         margin-top:14px; text-align:left; background:#fffbeb; border:1px solid var(--line);
         color:var(--brand); }
  .hidden { display:none; }
  .fine { font-size:12px; color:#8a7a63; margin-top:14px; line-height:1.8; }
</style></head><body>
<div class="card">
  <span class="badge">つづもん</span>

  <!-- 準備中（ふつうはここしか見えない） -->
  <section id="stWork">
    <h1>ちょっと待ってね</h1>
    <p>ぜんぶの単元をひらいています。</p>
    <div class="spinner"></div>
  </section>

  <!-- ログインが要るとき -->
  <section id="stLogin" class="hidden">
    <h1>はじめよう</h1>
    <p>LINEでログインすると、そのまま全単元がひらきます。<br>お支払いの登録はいりません。</p>
    <button class="big-btn btn-line" id="loginBtn" type="button">LINEではじめる</button>
    <p class="fine">ログインと同時に、つづもんの公式LINEが友だちに追加されます。</p>
  </section>

  <!-- うまくいかなかったとき（行き止まりにしない） -->
  <section id="stStop" class="hidden">
    <h1 id="stopTitle">お知らせ</h1>
    <div class="msg" id="stopMsg"></div>
    <a class="big-btn btn-main" id="stopGo" href="/ref/04/">無料の単元を読んでみる</a>
    <a class="big-btn btn-sub" href="/">つづもんについて</a>
  </section>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  initializeAuth, browserLocalPersistence, browserSessionPersistence,
  inMemoryPersistence, onAuthStateChanged,
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

var TRIAL_API = 'https://asia-northeast1-chatstudy-63477.cloudfunctions.net/tsudumonTrialStart';
var MAP_URL = '/map/?trial=started';   // マップ側が「はじまったよ」のバナーを出す

var app = initializeApp({ "apiKey": "AIzaSyBJuODbPmpu_fiJ8a1ffzDIUwEFszol5Cc", "authDomain": "chatstudy-63477.firebaseapp.com", "projectId": "chatstudy-63477", "appId": "1:283901969847:web:9efd3b421e8cdb16091432" });
var auth = initializeAuth(app, {
  persistence: [browserLocalPersistence, browserSessionPersistence, inMemoryPersistence],
});

var $ = function (id) { return document.getElementById(id); };
function show(id) {
  ['stWork', 'stLogin', 'stStop'].forEach(function (s) {
    $(s).classList.toggle('hidden', s !== id);
  });
}
function stop(title, msg, goHref, goLabel) {
  $('stopTitle').textContent = title;
  $('stopMsg').textContent = msg;
  if (goHref) $('stopGo').href = goHref;
  if (goLabel) $('stopGo').textContent = goLabel;
  show('stStop');
}

$('loginBtn').onclick = function () {
  // LINE内ブラウザは auto=1 で無操作ログイン。戻り先はこのページ。
  location.href = '/login/?auto=1&next=' + encodeURIComponent('/start/');
};

async function startTrial(user) {
  show('stWork');
  try {
    var idToken = await user.getIdToken();
    var res = await fetch(TRIAL_API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ idToken: idToken }),
    });
    var data = null;
    try { data = await res.json(); } catch (e) {}
    data = data || {};

    if (res.ok && data.ok) {
      location.href = MAP_URL;   // 成功。説明せずそのまま教材へ
      return;
    }
    // すでに使える人は、止めずに教材へ通す（「もう持ってるよ」を読ませる必要はない）
    if (data.reason === 'already_licensed') {
      location.href = '/map/';
      return;
    }
    if (data.reason === 'trial_used') {
      stop('おかえり！',
        '無料おためしは1回までなんだ。つづきをやるには、おうちの人に見てもらってね。' +
        'このトークで「おうちの人に見せたい」と送ると、案内がつくれるよ。',
        '/ref/04/', '無料の単元を読んでみる');
      return;
    }
    if (data.reason === 'is_parent') {
      stop('保護者の方へ',
        data.message || 'こちらは、お子さまご本人が使いはじめるためのページです。',
        '/parents/dashboard/', '学習の記録を見る');
      return;
    }
    if (res.status === 401 || res.status === 403) {
      show('stLogin');
      return;
    }
    stop('うまくいきませんでした',
      data.message || '時間をおいて、もう一度ためしてみてね。',
      '/ref/04/', '無料の単元を読んでみる');
  } catch (e) {
    stop('つながらなかったみたい',
      '電波のいいところで、もう一度ためしてみてね。',
      '/ref/04/', '無料の単元を読んでみる');
  }
}

onAuthStateChanged(auth, function (user) {
  if (user) startTrial(user);
  else show('stLogin');
});
</script>
</body></html>
