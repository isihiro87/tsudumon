<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>オフラインです｜つづもん</title>
<style>
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
         background:#fffdf8; color:#1c1917; margin:0;
         display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
  .card { max-width:360px; text-align:center; background:#fff; border:2px solid #fde68a;
          border-radius:18px; padding:28px 22px; box-shadow:0 8px 24px rgba(120,80,20,.12); }
  h1 { font-size:19px; color:#7c2d12; margin:10px 0 8px; }
  p { font-size:13.5px; line-height:1.9; color:#57534e; margin:0 0 18px; }
  a { display:block; background:#b45309; color:#fff; text-decoration:none; font-weight:bold;
      border-radius:13px; padding:13px; font-size:15px; }
  .ic { font-size:40px; }
</style></head><body>
  <div class="card">
    <div class="ic">📡</div>
    <h1>いま電波が届いていません</h1>
    <p>一度ひらいた単元は、電波がなくても読めます。<br>
       単元一覧から、読んだことのあるページを選んでね。</p>
    <a href="/map/">単元一覧をひらく</a>
  </div>
</body></html>
