<meta charset="utf-8">
<script>if(location.hostname==='tsudumon.web.app'){location.replace('https://tsudumon.jp'+location.pathname+location.search+location.hash);}</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>おうちの人に送る｜つづもん</title>
<!--
  おうちの人にわたすカードの「送る」導線。

  LINE の シェアターゲットピッカー（liff.shareTargetPicker）を開いて、
  友だち一覧から保護者を選んでもらう。送信は **子ども自身のアカウントから** 行われるので、
  保護者には「知らないBotからの通知」ではなく「自分の子からのメッセージ」として届く。
  ここが開封率を決める。

  流れ:
    Bot のカード「おうちの人に送る」
      → https://liff.line.me/{LIFF_ID}?t={token}
      → このページ（LIFFブラウザ）
      → liff.init → shareTargetPicker を自動で開く
      → 保護者を選ぶ → 案内文が届く → 閉じる

  開けなかったとき（LINE外のブラウザ・ピッカー非対応・キャンセル）は
  従来の /handoff/（QRコード＋台本）へ逃がす。ここを塞ぐと課金経路が消える。

  ⚠️ LIFF_ID は LINE Developers Console（つづもんの LINE Login チャネル）で
     LIFF アプリを作って発行する。エンドポイントURL は https://tsudumon.jp/share/、
     サイズは Compact、**「シェアターゲットピッカー」を利用するに設定**すること。
-->
<style>
  :root { --deep:#2f4858; --brand:#e0812c; --muted:#6b6b6b; --line:#e6e1d8; }
  * { box-sizing:border-box; }
  body { margin:0; background:#faf7f1; color:var(--deep);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
         line-height:1.7; }
  .wrap { max-width:420px; margin:0 auto; padding:28px 20px 40px; text-align:center; }
  h1 { font-size:19px; margin:14px 0 8px; }
  p { font-size:14px; margin:8px 0; }
  .muted { color:var(--muted); font-size:13px; }
  .spinner { width:34px; height:34px; margin:26px auto 0; border:3px solid var(--line);
             border-top-color:var(--brand); border-radius:50%; animation:spin .9s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion:reduce) { .spinner { animation:none; } }
  .btn { display:block; margin:12px 0; padding:14px 16px; border-radius:12px;
         font-size:15px; font-weight:700; text-decoration:none; border:0; width:100%;
         background:var(--brand); color:#fff; }
  .btn.sub { background:#fff; color:var(--deep); border:1px solid var(--line); }
  .done { font-size:40px; }
  [hidden] { display:none !important; }
</style>

<div class="wrap">
  <div id="loading">
    <div class="spinner"></div>
    <p class="muted">送り先をひらいています…</p>
  </div>

  <div id="done" hidden>
    <div class="done">✅</div>
    <h1>送れました</h1>
    <p class="muted">おうちの人のトークに、案内が届いています。</p>
    <button class="btn" type="button" id="close">とじる</button>
  </div>

  <div id="fallback" hidden>
    <h1 id="fbTitle">おうちの人に送る</h1>
    <p class="muted" id="fbNote">下のボタンから送れます。</p>
    <button class="btn" type="button" id="retry" hidden>送り先をえらぶ</button>
    <a class="btn sub" id="handoff" href="/handoff/">QRコードで見せる</a>
  </div>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
(function () {
  'use strict';

  // LIFF ID（LINE Login チャネル 2009587166 上のアプリ）。
  // scripts/setup-tsudumon-share-liff.ts で発行・確認できる。
  // 空にすると、このページは常に /handoff/（QR）へ逃がす。
  var LIFF_ID = '2009587166-j28FEScS';

  // ⚠️ **トークンは liff.init() のあとに読む。**
  // `https://liff.line.me/{id}?t=…` を開くと、LINE はいったん元のクエリを
  // `?liff.state=%3Ft%3D…` に畳んでこのページを開く。`liff.init()` が
  // それを展開して URL を書き戻すので、**初期化前に location.search を読むと空**になる。
  // （実際これで「リンクが見つかりません」が出た）
  function readToken() {
    var p = new URLSearchParams(location.search);
    var t = p.get('t');
    if (t) return t;
    // 展開前／展開されなかったときの保険
    var st = p.get('liff.state');
    if (st) {
      try {
        return new URLSearchParams(
          st.charAt(0) === '?' ? st.slice(1) : st
        ).get('t') || '';
      } catch (e) { /* 壊れた liff.state は無視 */ }
    }
    return '';
  }

  var token = '';
  var PARENT_URL = '';
  var HANDOFF_URL = '/handoff/';

  function setToken(t) {
    token = t;
    PARENT_URL = 'https://tsudumon.jp/parents/?t=' + encodeURIComponent(t);
    HANDOFF_URL = '/handoff/?t=' + encodeURIComponent(t);
    $('handoff').href = HANDOFF_URL;
  }

  var $ = function (id) { return document.getElementById(id); };

  function showFallback(title, note, canRetry) {
    $('loading').hidden = true;
    $('done').hidden = true;
    $('fallback').hidden = false;
    if (title) $('fbTitle').textContent = title;
    if (note) $('fbNote').textContent = note;
    $('retry').hidden = !canRetry;
  }

  function showDone() {
    $('loading').hidden = true;
    $('fallback').hidden = true;
    $('done').hidden = false;
  }

  // 保護者のトークに届くメッセージ。
  //
  // ⚠️ **短い案内文とリンクだけにする。** 学習の記録を売りにしない
  //    （どれだけやったかは、子が自分のスマホで見せられる）。
  //    ここでの役目は「つづもんとは何か」を保護者に届けることだけ。
  //
  // ⚠️ リンクは必ず **?t= 付きの保護者ページ**。裸の tsudumon.jp を送ると、
  //    保護者が登録しても**保護者自身のアカウントに課金され、子の教材が開かない**。
  //    このトークンが「支払いは子のアカウントに付ける」という印になっている。
  //    リンク先は保護者向けの案内ページそのもの（料金・解約・AIの扱い・登録）。
  function buildMessage() {
    return {
      type: 'flex',
      altText: 'つづもん（中学歴史の教材）を使っています',
      contents: {
        type: 'bubble',
        body: {
          type: 'box', layout: 'vertical', spacing: 'md',
          contents: [
            { type: 'text', text: 'つづもん', weight: 'bold', size: 'xl', color: '#2f4858' },
            { type: 'text', wrap: true, size: 'sm', color: '#333333',
              text: '中学歴史の教材です。つづけたいので、見てもらえますか。' },
            { type: 'button', style: 'primary', color: '#e0812c', height: 'sm',
              action: { type: 'uri', label: 'どんな教材か見る', uri: PARENT_URL } }
          ]
        }
      }
    };
  }

  function openPicker() {
    $('loading').hidden = false;
    $('fallback').hidden = true;
    liff.shareTargetPicker([buildMessage()]).then(function (res) {
      // res が無い＝ユーザーがキャンセルした（エラーではない）
      if (res) { showDone(); }
      else { showFallback('送り先をえらんでね', 'とちゅうでとじたみたいです。もう一度どうぞ。', true); }
    }).catch(function (e) {
      console.error('[share] shareTargetPicker failed:', e);
      showFallback('うまく送れませんでした', 'QRコードを見せる方法でも渡せます。', true);
    });
  }

  // LIFF SDK が無い／未設定なら、初期化を待たずに読めるぶんだけで QR へ逃がす
  if (!LIFF_ID || typeof liff === 'undefined') {
    var raw = readToken();
    if (raw) setToken(raw);
    location.replace(HANDOFF_URL);
    return;
  }

  liff.init({ liffId: LIFF_ID }).then(function () {
    // ここで初めてトークンが読める（liff.state が展開済み）
    var t = readToken();
    if (!t) {
      showFallback('リンクが見つかりません', 'LINEのトークから、もう一度カードを出してください。', false);
      return;
    }
    setToken(t);

    // LINE アプリの外（普通のブラウザ）ではピッカーが使えない
    if (!liff.isInClient() || !liff.isApiAvailable('shareTargetPicker')) {
      location.replace(HANDOFF_URL);
      return;
    }
    openPicker();
  }).catch(function (e) {
    console.error('[share] liff.init failed:', e);
    // 初期化が落ちても、読めるならトークン付きで QR ページへ送る
    var t = readToken();
    if (t) setToken(t);
    location.replace(HANDOFF_URL);
  });

  $('retry').addEventListener('click', openPicker);
  $('close').addEventListener('click', function () {
    if (typeof liff !== 'undefined' && liff.isInClient()) liff.closeWindow();
    else location.replace(HANDOFF_URL);
  });
})();
</script>
